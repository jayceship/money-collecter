[project]
name = "bomyung-recovery"
version = "0.3.0"
description = "봉명 재고회수 P0: 전자부품 재고 파일 접수·필드 추출·누락 표시·원문 근거·내보내기"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "openpyxl>=3.1,<3.2",
    "pypdf>=4.2,<6",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bomyung = "bomyung.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
